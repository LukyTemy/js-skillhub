syntax = "proto3";

package mail;

service MailService {
  rpc SendMail (SendMailRequest) returns (SendMailResponse);
}

message SendMailRequest {
  string to = 1;
  string subject = 2;
  string text = 3;
}

message SendMailResponse {
  bool success = 1;
  string messageId = 2;
  string error = 3;
}

