version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - courses-backend-mongo:/data/db
    networks:
      - app-net

  keycloak:
    image: quay.io/keycloak/keycloak
    command: start-dev --import-realm
    ports:
      - "8091:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=1234
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - app-net

  courses-backend:
    build:
      context: courses-backend
    ports:
      - "5001:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/courses-backend
      - CORS_ORIGIN=http://localhost:5002
      - MAIL_SERVICE_ADDRESS=mail-service:50051
    networks:
      - app-net
  mail-service:
    build:
      context: ./mail-service
    environment:
      - MAIL_SERVICE_PORT=50051
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "50051:50051"
    networks:
      - app-net
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=http://localhost:5001
    ports:
      - "5002:4173"
    depends_on:
      - courses-backend
    networks:
      - app-net

volumes:
  courses-backend-mongo:

networks:
  app-net: